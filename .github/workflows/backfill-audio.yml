name: Backfill Podcast Audio

# One-off: make audio for older newsletters. Run it from the Actions tab.
# Works in batches and commits after each, so a timeout never loses progress;
# re-running simply continues where it stopped.

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to cover'
        type: number
        default: 100
      dirs:
        description: 'Content folders to include (comma list)'
        type: string
        default: 'physics,ai,geopolitics,astronomy'
      batch:
        description: 'Episodes per batch (commit after each)'
        type: number
        default: 40

permissions:
  contents: write

concurrency:
  group: content-writes     # never runs at the same time as the daily generation
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: podcast/requirements.txt

      - name: Install audio dependencies
        run: pip install -r podcast/requirements.txt

      - name: Generate audio in batches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for round in $(seq 1 40); do
            set +e
            python -m podcast.build --days "${{ inputs.days }}" --dirs "${{ inputs.dirs }}" \
              --limit "${{ inputs.batch }}" --exit-code-when-done
            code=$?
            set -e
            git add podcast/episodes.json public/feeds/
            if ! git diff --staged --quiet; then
              git commit -m "podcast: backfill batch $round"
              git pull --rebase --quiet
              git push
            fi
            if [ "$code" = "3" ]; then echo "Backfill complete."; exit 0; fi
            if [ "$code" != "0" ]; then echo "Batch $round had failures; pausing 60s before continuing."; sleep 60; fi
            sleep 10   # be gentle with the TTS service between batches
          done
          echo "Stopped after 40 rounds; run the workflow again to continue."
