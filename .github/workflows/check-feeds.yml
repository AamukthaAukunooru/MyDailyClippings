name: Check RSS feeds

# Fetches every feed in scripts/categories.ts and reports which ones fail or
# return no items. Runs on pull requests that touch the feed lists, and by hand.

on:
  pull_request:
    paths:
      - 'scripts/categories.ts'
      - 'scripts/rss.ts'
      - 'scripts/check-feeds.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Fetch every feed
        run: npx tsx scripts/check-feeds.ts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Probe (temporary)
        if: always()
        run: >
          npx tsx scripts/probe-feeds.ts
          https://www.uber.com/blog/engineering/rss/ https://www.uber.com/en-IN/blog/engineering/rss/ https://www.uber.com/blog/rss/
          https://developers.googleblog.com/rss/ https://developers.googleblog.com/feed/ https://developers.googleblog.com/feeds/posts/default?alt=rss
          https://blog.google/technology/safety-security/rss/ https://blog.google/security/rss/ https://blog.google/products/chrome/rss/ https://blog.google/rss/
          https://security.googleblog.com/feeds/posts/default?alt=rss https://security.googleblog.com/atom.xml
          https://www.linkedin.com/blog/engineering/rss https://engineering.linkedin.com/blog.rss.html https://www.linkedin.com/blog/engineering/feed
          https://bytes.swiggy.com/feed https://medium.com/feed/swiggy-bytes
          https://tech.phonepe.com/rss/ https://tech.phonepe.com/index.xml https://tech.phonepe.com/feed
          https://medicalxpress.com/rss-feed/neuroscience/ https://medicalxpress.com/rss-feed/neuroscience-news/
          https://www.newscientist.com/subject/physics/feed/ https://neurosciencenews.com/feed/
          "https://hnrss.org/newest?q=post-mortem&points=40" "https://hnrss.org/newest?q=outage&points=80"
          https://blog.cloudflare.com/tag/post-mortem/rss/ https://engineering.atspotify.com/feed/ https://stripe.com/blog/feed.rss
          https://www.swiggy.com/corporate/blog/feed https://blog.zomato.com/rss https://medium.com/feed/zomato-technology https://medium.com/feed/@Pinterest_Engineering
          https://careersatdoordash.com/engineering-blog/feed/ https://doordash.engineering/feed/ https://blog.bytebytego.com/feed https://www.datadoghq.com/blog/engineering/feed/
