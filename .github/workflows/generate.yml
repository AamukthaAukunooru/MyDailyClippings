name: Generate Daily Newsletters

on:
  schedule:
    - cron: '30 22 * * *'   # 4:00 AM IST (UTC+5:30) daily — accounts for GitHub scheduler delay
  workflow_dispatch:        # Manual trigger for testing
    inputs:
      force:
        description: 'Force regenerate even if today already exists'
        type: boolean
        default: false
      only:
        description: 'Which parts to generate (comma list of news,explainers,questions)'
        type: string
        default: 'news,explainers,questions'

permissions:
  contents: write           # commit newsletters, upload audio to Releases
  issues: write             # failure alerts, closing answered questions

concurrency:
  group: content-writes     # shared with the backfill workflow
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate newsletters, explainers and answers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
          ONLY: ${{ inputs.only }}
        run: npx tsx scripts/generate-newsletter.ts

      - name: Commit new pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add newsletters/ topics/
          if git diff --staged --quiet; then
            echo "No new pages generated."
          else
            git commit -m "clippings: daily newsletters for $(date +%Y-%m-%d)"
            git pull --rebase --quiet
            git push
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: podcast/requirements.txt

      - name: Install audio dependencies
        run: pip install -r podcast/requirements.txt

      - name: Build audio and podcast feeds
        id: audio
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m podcast.build --days 3

      - name: Reading List
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          READING_LIST_PREFIX: ${{ secrets.READING_LIST_PREFIX }}
        run: python -m podcast.reading_list

      - name: Commit audio manifest and feeds
        run: |
          git add podcast/episodes.json podcast/reading-list.json public/feeds/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No audio changes."
          else
            git commit -m "podcast: audio and feeds for $(date +%Y-%m-%d)"
            git pull --rebase --quiet
            git push
          fi

      - name: Close answered questions
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s .answered-issues.txt ] || exit 0
          while read -r number url; do
            [ -n "$number" ] || continue
            gh issue close "$number" --comment "Answered: $url (live after the next site deploy). The audio episode is in the Curious Questions show."
          done < .answered-issues.txt

      - name: Open an issue if anything failed
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIO_OUTCOME: ${{ steps.audio.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=""
          if [ -s .generation-failures.txt ]; then
            body+=$'### Generation failures\n'
            body+="$(sed 's/^/- /' .generation-failures.txt)"$'\n\n'
          fi
          if [ "$AUDIO_OUTCOME" = "failure" ]; then
            body+=$'### Audio\nSome episodes failed to synthesize or upload; they will be retried on the next run.\n\n'
          fi
          if [ "${{ job.status }}" != "success" ]; then
            body+=$'### Workflow\nA workflow step failed.\n\n'
          fi
          [ -n "$body" ] || exit 0
          body+="Run: $RUN_URL"
          gh issue create --title "Daily run problems: $(date +%Y-%m-%d)" --body "$body"
